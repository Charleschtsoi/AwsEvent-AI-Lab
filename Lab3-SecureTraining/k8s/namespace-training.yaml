apiVersion: v1
kind: Namespace
metadata:
  name: training
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# default-deny: no ingress, no egress for anything in the training namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: training
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
