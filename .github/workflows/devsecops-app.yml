# DevSecOps workflow for the lab's app (slides 34–35): shift left, shield right.
# Every job is a required status check on main (Settings → Branches → Branch protection).
# Rollout: ENFORCE=false (Crawl: audit, build a baseline) → true (Walk/Run: block).
name: devsecops-app
on:
  pull_request:
  push:
    branches: [main]
    paths: ["LLMChatbot/**", "SASTTest/**", "SCATest/**", "AIApp/**", ".github/workflows/devsecops-app.yml"]

permissions:
  contents: read

env:
  ENFORCE: "false"          # flip to "true" once the baseline is clean
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-chatbot

jobs:
  sast-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Secrets (TruffleHog, full history)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        continue-on-error: ${{ env.ENFORCE != 'true' }}   # the action already runs with --fail
        with:
          extra_args: --results=verified,unknown
      - name: SAST (Semgrep + Bandit)
        run: |
          pip install "semgrep==1.*" "bandit==1.8.*"
          semgrep scan --config p/python --config p/secrets --sarif -o semgrep.sarif --error . || [ "$ENFORCE" != "true" ]
          bandit -r LLMChatbot SASTTest -ll || [ "$ENFORCE" != "true" ]

  sca-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: SCA (Grype on dependency manifests)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          only-fixed: true
          severity-cutoff: critical
          fail-build: ${{ env.ENFORCE == 'true' }}
          output-format: table
      - name: IaC (Checkov on manifests & Dockerfiles)
        run: |
          pip install "checkov==3.*"
          checkov -d AIApp -d Lab3-SecureTraining/k8s -d Lab3-SecureTraining/runtime -d LLMChatbot \
            --framework kubernetes,dockerfile --compact ${{ env.ENFORCE != 'true' && '--soft-fail' || '' }}

  build-image:
    needs: [sast-secrets, sca-iac]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: LLMChatbot/llm-chatbot
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max      # SLSA provenance attestation from BuildKit
          sbom: true
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: LLMChatbot/llm-chatbot
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

  scan-image:
    needs: build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Grype image scan (by digest) — block fixable criticals
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ needs.build-image.outputs.digest }}
          only-fixed: true
          severity-cutoff: critical
          fail-build: ${{ env.ENFORCE == 'true' }}
          # add a VEX file for not-affected CVEs:  vex: vex/openvex.json

  sign-attest:
    needs: [build-image, scan-image]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write}   # id-token → keyless OIDC signing
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: sbom.cdx.json}
      - name: cosign keyless sign + SBOM attestation
        env: {REF: "${{ env.IMAGE }}@${{ needs.build-image.outputs.digest }}"}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/devsecops-app.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-gitops:
    needs: [build-image, sign-attest]
    runs-on: ubuntu-latest
    environment: production        # add a required reviewer on this environment (Settings → Environments)
    steps:
      - name: Hand the digest to GitOps (Argo CD syncs by digest; Kyverno verifies at admission)
        run: |
          echo "image: ${IMAGE}@${{ needs.build-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Update your GitOps repo / kustomization with this digest. Admission policy: Lab1-Platform/kyverno/verify-image-keyless.yaml"
  # runtime-shield lives in the cluster, not in CI: Falco/Tetragon, ZAP DAST on staging, KSPM (kube-bench),
  # daily registry re-scan, Pod Security 'restricted', immutable backups (Kasten). See README → Runtime.
